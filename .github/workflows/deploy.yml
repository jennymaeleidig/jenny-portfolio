name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check REUSE provenance
        run: |
          python3 -m venv /tmp/reuse-venv
          /tmp/reuse-venv/bin/pip install "reuse[charset-normalizer]"
          /tmp/reuse-venv/bin/reuse lint

      - name: Lint provenance
        run: make lint:provenance

      - name: Validate the citation file
        run: |
          python3 -m venv /tmp/cff-venv
          /tmp/cff-venv/bin/pip install cffconvert
          /tmp/cff-venv/bin/cffconvert --validate

      - name: Install the markdown parser
        run: |
          sudo apt-get update
          sudo apt-get install -y cmark-gfm

      - name: Build
        run: make build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: make test

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
