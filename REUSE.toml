version = 1

# First-party original code, tooling, and configuration: dedicated to the
# public domain under CC0.
[[annotations]]
path = [
  ".github/workflows/**",
  ".gitignore",
  ".husky/**",
  ".pi-lens.json",
  ".pi/**",
  ".prettierignore",
  ".prettierrc.json",
  "Makefile",
  "codemeta.json",
  "jsconfig.json",
  "package.json",
  "package-lock.json",
  "scripts/**",
  "layouts/**",
  "assets/*.mjs",
  "assets/*.js",
  "tests/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Jenny Leidig"
SPDX-License-Identifier = "CC0-1.0"

# Editorial prose: writing kept under explicit all-rights-reserved terms.
[[annotations]]
path = [
  "*.md",
  "content/**",
  "docs/**",
  "vocabulary/**",
  "assets/favicon.md",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Jenny Leidig"
SPDX-License-Identifier = "LicenseRef-AllRightsReserved"

# First-party images: kept under explicit all-rights-reserved terms.
[[annotations]]
path = [
  "assets/*.png",
  "assets/*.jpg",
  "assets/*.svg",
  "assets/projects/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Jenny Leidig"
SPDX-License-Identifier = "LicenseRef-AllRightsReserved"

# The favicon cloud is a CC0 asset by Kuramaru, credited in assets/favicon.md.
[[annotations]]
path = "assets/favicon.png"
precedence = "closest"
SPDX-FileCopyrightText = "Kuramaru (kuramarushka)"
SPDX-License-Identifier = "CC0-1.0"

# The identity block is site plumbing (code, not prose): CC0.
[[annotations]]
path = "content/identity.sh"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Jenny Leidig"
SPDX-License-Identifier = "CC0-1.0"

# Eric Meyer's reset stylesheet: the author's own public-domain statement.
[[annotations]]
path = "assets/reset.css"
precedence = "closest"
SPDX-FileCopyrightText = "2011 Eric Meyer"
SPDX-License-Identifier = "LicenseRef-PublicDomain"

# The forked Monospace Web grid: whole-file MIT with dual copyright. The
# in-file upstream notice travels untouched; the table adds the fork's own
# copyright line to the machine-readable record.
[[annotations]]
path = "assets/site.css"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2024 Oskar Wickström", "2026 Jenny Leidig"]
SPDX-License-Identifier = "MIT"

# The Commit Mono variable font and its travelling notices.
[[annotations]]
path = "assets/fonts/**"
precedence = "closest"
SPDX-FileCopyrightText = "2023 Eigil Nikolajsen"
SPDX-License-Identifier = "OFL-1.1"

# The vendored jenny generator, byte-identical upstream: bulk-annotated MIT.
[[annotations]]
path = "vendor/jenny/**"
precedence = "closest"
SPDX-FileCopyrightText = "2017-2021 Conrado Patricio Ambrosio"
SPDX-License-Identifier = "MIT"

# Synthetic provenance trees for cite-lint's own tests: deliberately malformed
# inventories, so their notices come from this table alone and their file
# contents are never read for tags.
[[annotations]]
path = "tests/fixtures/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Jenny Leidig"
SPDX-License-Identifier = "CC0-1.0"
